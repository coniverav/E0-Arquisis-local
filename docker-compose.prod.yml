services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - energyshark_net

  # Acceso PostgreSQL para Lambda sin cambiar ni reiniciar el contenedor db.
  # El host publica este puerto solo en su IP privada; AWS SG admite únicamente
  # el security group creado para las Lambdas de saga.
  saga-db-proxy:
    image: haproxy:3.0-alpine@sha256:7430e63d3052198b18a40665b59a5826bc428e8bceb0c561d82258149ef855ee
    container_name: saga-db-proxy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/proxy/haproxy-postgres.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${E3_EC2_PRIVATE_IP:-127.0.0.1}:${E3_POSTGRES_PROXY_PORT:-15432}:15432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - energyshark_net

  # Squid sólo permite CONNECT:443 hacia Wallet/JWKS, Secrets Manager y
  # Step Functions. No registra headers ni cuerpos que puedan contener secretos.
  saga-https-proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:d9c34c5ab74c6dd41cf1070d9b4221aac072e67e983527ca2d41512958f77506
    container_name: saga-https-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/proxy/squid-sagas.conf:/etc/squid/squid.conf:ro
    tmpfs:
      - /run
      - /var/log/squid
      - /var/spool/squid
    ports:
      - "${E3_EC2_PRIVATE_IP:-127.0.0.1}:${E3_HTTPS_PROXY_PORT:-3128}:3128"
    healthcheck:
      test: ["CMD", "pebble", "health"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - energyshark_net

  migrate:
    image: ${ECR_REPOSITORY}:api-${IMAGE_TAG}
    container_name: migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - energyshark_net

  master:
    image: ${ECR_REPOSITORY}:api-${IMAGE_TAG}
    container_name: master
    restart: unless-stopped
    command:
      - newrelic-admin
      - run-program
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE_NAME: master
      E3_SELLER_SAGA_ENABLED: ${E3_SELLER_SAGA_ENABLED:-false}
      E3_BUYER_SAGA_ENABLED: ${E3_BUYER_SAGA_ENABLED:-false}
      E3_SELLER_STATE_MACHINE_ARN: ${E3_SELLER_STATE_MACHINE_ARN:-}
      E3_BUYER_STATE_MACHINE_ARN: ${E3_BUYER_STATE_MACHINE_ARN:-}
      CYCLE_REPORT_WINDOW_SECONDS: ${CYCLE_REPORT_WINDOW_SECONDS}
      CITY_ID: ${CITY_ID}
      RABBITMQ_CENTRAL_ROUTING_KEY: ${RABBITMQ_CENTRAL_ROUTING_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SSE_OUTBOX_AGE_SECONDS: ${SSE_OUTBOX_AGE_SECONDS:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY is required}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-EnergyShark Backend}
      NEW_RELIC_MONITOR_MODE: ${NEW_RELIC_MONITOR_MODE:-true}
      NEW_RELIC_LOG: ${NEW_RELIC_LOG:-stdout}
      WALLET_BASE_URL: ${WALLET_BASE_URL}
      WALLET_JWKS_URL: ${WALLET_JWKS_URL:-}
      WALLET_API_KEY: ${WALLET_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - energyshark_net

  master2:
    image: ${ECR_REPOSITORY}:api-${IMAGE_TAG}
    container_name: master2
    restart: unless-stopped
    command:
      - newrelic-admin
      - run-program
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE_NAME: master2
      E3_SELLER_SAGA_ENABLED: ${E3_SELLER_SAGA_ENABLED:-false}
      E3_BUYER_SAGA_ENABLED: ${E3_BUYER_SAGA_ENABLED:-false}
      E3_SELLER_STATE_MACHINE_ARN: ${E3_SELLER_STATE_MACHINE_ARN:-}
      E3_BUYER_STATE_MACHINE_ARN: ${E3_BUYER_STATE_MACHINE_ARN:-}
      CYCLE_REPORT_WINDOW_SECONDS: ${CYCLE_REPORT_WINDOW_SECONDS}
      CITY_ID: ${CITY_ID}
      RABBITMQ_CENTRAL_ROUTING_KEY: ${RABBITMQ_CENTRAL_ROUTING_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SSE_OUTBOX_AGE_SECONDS: ${SSE_OUTBOX_AGE_SECONDS:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY is required}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-EnergyShark Backend}
      NEW_RELIC_MONITOR_MODE: ${NEW_RELIC_MONITOR_MODE:-true}
      NEW_RELIC_LOG: ${NEW_RELIC_LOG:-stdout}
      WALLET_BASE_URL: ${WALLET_BASE_URL}
      WALLET_JWKS_URL: ${WALLET_JWKS_URL:-}
      WALLET_API_KEY: ${WALLET_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - energyshark_net

  cycle-scheduler:
    image: ${ECR_REPOSITORY}:api-${IMAGE_TAG}
    container_name: cycle-scheduler
    restart: unless-stopped
    command:
      - newrelic-admin
      - run-program
      - python
      - -m
      - app.workers.cycle_scheduler
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY is required}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_WORKER_APP_NAME:-EnergyShark Scheduler}
      NEW_RELIC_MONITOR_MODE: ${NEW_RELIC_MONITOR_MODE:-true}
      NEW_RELIC_LOG: ${NEW_RELIC_LOG:-stdout}
      DATABASE_URL: ${DATABASE_URL}
      E3_SELLER_SAGA_ENABLED: ${E3_SELLER_SAGA_ENABLED:-false}
      E3_BUYER_SAGA_ENABLED: ${E3_BUYER_SAGA_ENABLED:-false}
      E3_SELLER_STATE_MACHINE_ARN: ${E3_SELLER_STATE_MACHINE_ARN:-}
      E3_BUYER_STATE_MACHINE_ARN: ${E3_BUYER_STATE_MACHINE_ARN:-}
      CYCLE_REPORT_WINDOW_SECONDS: ${CYCLE_REPORT_WINDOW_SECONDS}
      CYCLE_SCHEDULER_POLL_SECONDS: ${CYCLE_SCHEDULER_POLL_SECONDS}
      CITY_ID: ${CITY_ID}
      RABBITMQ_CENTRAL_ROUTING_KEY: ${RABBITMQ_CENTRAL_ROUTING_KEY}
      WALLET_BASE_URL: ${WALLET_BASE_URL}
      WALLET_JWKS_URL: ${WALLET_JWKS_URL:-}
      WALLET_API_KEY: ${WALLET_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from app.database import engine; from sqlalchemy import text; conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close()"
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - energyshark_net

  connector:
    image: ${ECR_REPOSITORY}:connector-${IMAGE_TAG}
    container_name: connector
    restart: unless-stopped
    command: ["newrelic-admin", "run-program", "python", "connector.py"]
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY is required}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_CONNECTOR_APP_NAME:-EnergyShark Connector}
      NEW_RELIC_MONITOR_MODE: ${NEW_RELIC_MONITOR_MODE:-true}
      NEW_RELIC_LOG: ${NEW_RELIC_LOG:-stdout}
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      RABBITMQ_MARKET_QUEUE: ${RABBITMQ_MARKET_QUEUE}
      RABBITMQ_MARKET_EXCHANGE: ${RABBITMQ_MARKET_EXCHANGE}
      CITY_ID: ${CITY_ID}
      RABBITMQ_OUTBOUND_EXCHANGE: ${RABBITMQ_OUTBOUND_EXCHANGE}
      RABBITMQ_CENTRAL_ROUTING_KEY: ${RABBITMQ_CENTRAL_ROUTING_KEY}
      MASTER_URL: ${MASTER_URL}
      MASTER_ERROR_URL: ${MASTER_ERROR_URL}
      MASTER_AUDIT_URL: ${MASTER_AUDIT_URL}
      MASTER_OUTBOUND_AUDIT_URL: ${MASTER_OUTBOUND_AUDIT_URL}
      CONNECTOR_RETRY_SECONDS: ${CONNECTOR_RETRY_SECONDS}
      HTTP_RETRY_SECONDS: ${HTTP_RETRY_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
      MASTER_OUTBOUND_DISPATCH_URL: ${MASTER_OUTBOUND_DISPATCH_URL}
      OUTBOUND_POLL_SECONDS: ${OUTBOUND_POLL_SECONDS}
      MASTER_OUTBOX_RELAY_CLAIM_URL: ${MASTER_OUTBOX_RELAY_CLAIM_URL:-http://master:8000/internal/outbox-relay/claims}
      MASTER_OUTBOX_RELAY_RESULT_URL: ${MASTER_OUTBOX_RELAY_RESULT_URL:-http://master:8000/internal/outbox-relay}
      E3_BROKER_OUTBOX_RELAY_ENABLED: ${E3_BROKER_OUTBOX_RELAY_ENABLED:-false}
      E3_SAGA_OUTBOX_RELAY_ENABLED: ${E3_SAGA_OUTBOX_RELAY_ENABLED:-false}
      E3_BUYER_CALLBACK_RELAY_ENABLED: ${E3_BUYER_CALLBACK_RELAY_ENABLED:-false}
      E3_OUTBOX_RELAY_POLL_SECONDS: ${E3_OUTBOX_RELAY_POLL_SECONDS:-1}
      E3_OUTBOX_RELAY_LEASE_SECONDS: ${E3_OUTBOX_RELAY_LEASE_SECONDS:-30}
      E3_OUTBOX_RELAY_BATCH_SIZE: ${E3_OUTBOX_RELAY_BATCH_SIZE:-20}
      E3_OUTBOX_PUBLISH_TIMEOUT_SECONDS: ${E3_OUTBOX_PUBLISH_TIMEOUT_SECONDS:-10}
      E3_SELLER_STATE_MACHINE_ARN: ${E3_SELLER_STATE_MACHINE_ARN:-}
      E3_BUYER_STATE_MACHINE_ARN: ${E3_BUYER_STATE_MACHINE_ARN:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_SERVICE_ENDPOINT_MODE: IPv4
      AWS_METADATA_SERVICE_TIMEOUT: ${AWS_METADATA_SERVICE_TIMEOUT:-2}
      AWS_METADATA_SERVICE_NUM_ATTEMPTS: ${AWS_METADATA_SERVICE_NUM_ATTEMPTS:-3}
      NO_PROXY: ${NO_PROXY:-169.254.169.254}
    depends_on:
      master:
        condition: service_healthy
    networks:
      - energyshark_net

  newrelic-infra:
    image: newrelic/infrastructure:latest
    container_name: newrelic-infra
    restart: unless-stopped
    privileged: true
    network_mode: host
    pid: host
    cgroup: host
    cap_add:
      - SYS_PTRACE
    volumes:
      - "/:/host:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      NRIA_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY is required}
      NRIA_DISPLAY_NAME: ${NEW_RELIC_INFRA_DISPLAY_NAME:-EnergyShark EC2}

networks:
  energyshark_net:
    name: energyshark_net

volumes:
  postgres_data:
