services:
  # Base de datos compartida por ambas réplicas de master.
  db:
    build: ./db
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo accesible desde el host; no queda publicado a Internet en EC2.
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - energyshark_net

  # Primera instancia. El nombre "master" es el que usa connector por DNS Docker.
  master:
    build: ./master
    container_name: master
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE_NAME: master
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - energyshark_net

  # Segunda instancia para la parte variable de balanceo de carga.
  master2:
    build: ./master
    container_name: master2
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INSTANCE_NAME: master2
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - energyshark_net

  # Consumidor RabbitMQ independiente de la API web.
  connector:
    build: ./connector
    container_name: connector
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE}
      MASTER_URL: ${MASTER_URL}
      CONNECTOR_RETRY_SECONDS: ${CONNECTOR_RETRY_SECONDS}
      HTTP_RETRY_SECONDS: ${HTTP_RETRY_SECONDS}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS}
    depends_on:
      master:
        condition: service_healthy
    networks:
      - energyshark_net

networks:
  energyshark_net:
    name: energyshark_net

volumes:
  postgres_data:
