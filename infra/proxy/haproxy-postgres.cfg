global
    log stdout format raw local0
    maxconn 64

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend postgres_lambda
    bind :15432
    default_backend postgres_docker

backend postgres_docker
    server postgres db:5432 check inter 5s fall 2 rise 2 init-addr last,libc,none
