# Proxy CONNECT exclusivo para las Lambdas de saga. El security group limita
# el origen; esta allowlist limita además cada destino y el puerto remoto.
http_port 3128
visible_hostname energyshark-saga-egress

acl CONNECT method CONNECT
acl TLS_port port 443
acl saga_destinations dstdomain wallet.iic2173.org
acl saga_destinations dstdomain secretsmanager.us-east-1.amazonaws.com
acl saga_destinations dstdomain states.us-east-1.amazonaws.com

http_access deny !CONNECT
http_access deny !TLS_port
http_access allow saga_destinations
http_access deny all

cache deny all
access_log none
cache_log /dev/stderr
pid_filename /run/squid.pid
coredump_dir /var/spool/squid
