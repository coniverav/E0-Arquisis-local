# NGINX DEBE instalarse en el HOST EC2, NO dentro de Docker.
# Este archivo ya implementa la parte variable de balanceo de carga.

upstream energyshark_backend {
    # Cada réplica es individualmente alcanzable desde el host.
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
}

server {
    server_name coniverav.tech www.coniverav.tech;

    # Necesario para el challenge HTTP-01 inicial de Let's Encrypt.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # El POST del connector no debe quedar expuesto al público.
    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://energyshark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/coniverav.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/coniverav.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.coniverav.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = coniverav.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name coniverav.tech www.coniverav.tech;
    return 404; # managed by Certbot




}